stages:
  - build
  - deploy

build-site:
  stage: build
  image: node:latest
  script:
    - npm install --global pnpm@latest-10
    - pnpm install
    - touch TESTING_FILE.txt
  artifacts:
    paths:
      - TESTING_FILE.txt
      - node_modules/*
      - dist/*

deploy-site:
  stage: deploy
  image: node:latest
  script:
    - pnpm wrangler pages deploy dist --project-name=$PROJECT_NAME