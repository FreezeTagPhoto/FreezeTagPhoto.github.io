stages:
  - build
  - deploy

build-site:
  stage: build
  image: node:latest
  script:
    - npm install --global pnpm@latest-10
    - pnpm install
  artifacts:
    paths:
      - node_modules/*
      - dist/*

deploy-site:
  stage: deploy
  image: jfxs/wrangler:latest
  script:
    - npx wrangler pages deploy dist --project-name=$PROJECT_NAME