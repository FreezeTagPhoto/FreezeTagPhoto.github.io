stages:
  - build
  - deploy

build-site:
  stage: build
  image: node:latest
  script:
    - npm install --global pnpm@latest-10
    - pnpm install
  artifacts:
    paths:
      - node_modules/*
      - dist/*

build-book:
  stage: build
  image: 
    name: peaceiris/mdbook:latest
    entrypoint: ["/bin/sh"]
  script:
    - mdbook build documentation-book --dest-dir dist/documentation
  artifacts:
    paths:
      - documentation-book/book/*

deploy-site:
  stage: deploy
  image: jfxs/wrangler:latest
  script:
    - npx wrangler pages deploy dist --project-name=$PROJECT_NAME --branch=main
